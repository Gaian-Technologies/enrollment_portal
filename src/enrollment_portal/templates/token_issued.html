<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} - {{ site_name }}</title>
    <link rel="stylesheet" href="/enroll/static/main.css?v={{ static_asset_version }}">
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <h1>Enrollment token issued</h1>
        <p class="lede">Use this Hub URL and enrollment token in the Home Assistant setup flow.</p>
        <p><strong>Hub URL</strong></p>
        <pre class="token">{{ hub_url }}</pre>
        <p><strong>Enrollment token</strong></p>
        <pre class="token">{{ enrollment_token }}</pre>
        <p>This token expires in {{ invite_lifetime }}.</p>
      </section>
    </main>
  </body>
</html>
